<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 坦克大战 - 经典版</title>
    <style>
        /* ==================== 全局样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            margin: 0;
        }

        .game-wrapper {
            background: #0f0f1f;
            border-radius: 28px;
            padding: 24px 28px 28px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            max-width: 780px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 8px 12px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title h1 {
            color: #f0e68c;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(240, 230, 140, 0.25);
        }
        .title .icon-tank {
            font-size: 26px;
            filter: drop-shadow(0 0 6px rgba(255, 200, 50, 0.4));
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #b8c6db;
            font-size: 14px;
            font-weight: 500;
        }
        .stat-item .label {
            opacity: 0.6;
            font-weight: 400;
        }
        .stat-item .value {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            min-width: 24px;
            text-align: center;
        }
        .stat-item .value.high {
            color: #ffd700;
        }
        .stat-item .value.lives {
            color: #ff6b6b;
        }

        .canvas-wrapper {
            position: relative;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 4px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 14px;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            background: #1e1e3a;
            touch-action: none;
            cursor: crosshair;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            inset: 4px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 10;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay .big-icon {
            font-size: 56px;
            filter: drop-shadow(0 0 20px rgba(255, 200, 50, 0.3));
        }
        .overlay .msg-title {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .overlay .msg-title.win {
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .overlay .msg-title.lose {
            color: #ff4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.3);
        }
        .overlay .msg-sub {
            color: #aab;
            font-size: 15px;
            opacity: 0.8;
        }
        .overlay .btn-overlay {
            background: #ffd700;
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .overlay .btn-overlay:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.4);
        }
        .overlay .btn-overlay:active {
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 14px;
            margin-top: 2px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            padding: 8px 20px;
            border-radius: 30px;
            color: #d0d8e8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.20);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.primary {
            background: #ffd700;
            border-color: #ffd700;
            color: #1a1a2e;
            box-shadow: 0 2px 16px rgba(255, 215, 0, 0.15);
        }
        .btn.primary:hover {
            background: #ffe44d;
            border-color: #ffe44d;
            box-shadow: 0 4px 24px rgba(255, 215, 0, 0.25);
        }
        .btn.danger {
            border-color: rgba(255, 71, 87, 0.3);
            color: #ff6b7a;
        }
        .btn.danger:hover {
            background: rgba(255, 71, 87, 0.12);
            border-color: rgba(255, 71, 87, 0.5);
        }
        .btn .icon {
            font-size: 16px;
        }

        .save-indicator {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }
        .save-indicator.saved {
            color: #7bed9f;
            border-color: rgba(123, 237, 159, 0.15);
        }

        .rules {
            text-align: center;
            color: #8a9bb5;
            font-size: 13px;
            margin-top: 12px;
            padding: 8px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .rules .highlight {
            color: #ffd700;
            font-weight: 600;
        }

        .touch-controls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            touch-action: none;
        }
        .touch-dpad {
            display: grid;
            grid-template-columns: 56px 56px 56px;
            grid-template-rows: 56px 56px 56px;
            gap: 4px;
            touch-action: none;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #d0d8e8;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            transition: background 0.08s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .touch-btn:active {
            background: rgba(255, 215, 0, 0.20);
            border-color: rgba(255, 215, 0, 0.30);
        }
        .touch-btn.empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }
        .touch-btn.fire-btn {
            background: rgba(255, 71, 87, 0.20);
            border-color: rgba(255, 71, 87, 0.30);
            font-size: 20px;
            font-weight: 700;
            color: #ff6b7a;
            margin-left: 12px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
        }
        .touch-btn.fire-btn:active {
            background: rgba(255, 71, 87, 0.40);
            border-color: rgba(255, 71, 87, 0.60);
        }

        @media (max-width: 640px) {
            .game-wrapper {
                padding: 14px 14px 18px 14px;
                border-radius: 20px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .title h1 {
                font-size: 18px;
            }
            .stats {
                padding: 4px 12px 4px 14px;
                gap: 6px 12px;
                justify-content: space-around;
                border-radius: 30px;
            }
            .stat-item {
                font-size: 12px;
            }
            .stat-item .value {
                font-size: 14px;
                min-width: 18px;
            }
            .controls {
                gap: 8px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .touch-controls {
                display: flex;
            }
            .overlay .msg-title {
                font-size: 22px;
            }
            .overlay .btn-overlay {
                padding: 10px 30px;
                font-size: 16px;
            }
            .rules {
                font-size: 12px;
                margin-top: 8px;
                padding: 6px 10px;
            }
        }
        @media (max-width: 420px) {
            .game-wrapper {
                padding: 10px 10px 14px 10px;
            }
            .touch-dpad {
                grid-template-columns: 48px 48px 48px;
                grid-template-rows: 48px 48px 48px;
                gap: 3px;
            }
            .touch-btn {
                font-size: 18px;
                border-radius: 10px;
            }
            .touch-btn.fire-btn {
                width: 54px;
                height: 54px;
                font-size: 16px;
                margin-left: 8px;
            }
            .stat-item {
                font-size: 11px;
            }
            .stat-item .value {
                font-size: 12px;
            }
            .title h1 {
                font-size: 16px;
            }
        }
        @media (hover: hover) and (pointer: fine) {
            .touch-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper" role="main" aria-label="坦克大战游戏">
        <div class="header">
            <div class="title">
                <span class="icon-tank">🎖️</span>
                <h1>坦克大战</h1>
            </div>
            <div class="stats" id="statsPanel">
                <span class="stat-item"><span class="label">🏆 分数</span><span class="value" id="scoreDisplay">0</span></span>
                <span class="stat-item"><span class="label">⭐ 最高</span><span class="value high" id="highScoreDisplay">0</span></span>
                <span class="stat-item"><span class="label">❤️ 生命</span><span class="value lives" id="livesDisplay">3</span></span>
                <span class="stat-item"><span class="label">🎯 敌方</span><span class="value" id="enemyCountDisplay">0</span></span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="520" height="520"></canvas>
            <div class="overlay active" id="overlay">
                <div class="big-icon" id="overlayIcon">🎮</div>
                <div class="msg-title" id="overlayTitle">坦克大战</div>
                <div class="msg-sub" id="overlaySub">方向键移动 · 空格射击 · 消灭所有敌人</div>
                <button class="btn-overlay" id="overlayBtn">开始游戏</button>
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="btn primary" id="btnStart">▶ 开始</button>
                <button class="btn" id="btnRestart">⟳ 重开</button>
                <button class="btn" id="btnSave">💾 存档</button>
                <button class="btn" id="btnLoad">📂 读档</button>
            </div>
            <span class="save-indicator" id="saveIndicator">未存档</span>
        </div>

        <div class="rules">
            <span class="highlight">⬆⬇⬅➡</span> / <span class="highlight">WASD</span> 移动 &nbsp;·&nbsp;
            <span class="highlight">空格</span> / <span class="highlight">🔥</span> 射击 &nbsp;·&nbsp;
            消灭所有 <span style="color:#ff6b6b;">红色敌方坦克</span> 获胜！
        </div>

        <div class="touch-controls" id="touchControls">
            <div class="touch-dpad">
                <div class="touch-btn empty"></div>
                <div class="touch-btn" data-dir="up">↑</div>
                <div class="touch-btn empty"></div>
                <div class="touch-btn" data-dir="left">←</div>
                <div class="touch-btn" data-dir="down">↓</div>
                <div class="touch-btn" data-dir="right">→</div>
                <div class="touch-btn empty"></div>
                <div class="touch-btn empty"></div>
                <div class="touch-btn empty"></div>
            </div>
            <div class="touch-btn fire-btn" id="touchFire">🔥</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // =============================================================
            // 1. 常量定义
            // =============================================================
            const COLS = 13,
                ROWS = 13,
                CELL_SIZE = 40,
                CANVAS_SIZE = COLS * CELL_SIZE;
            const T = { EMPTY: 0, GREY: 1, RED: 2, OUTER: 3 };
            const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
            const DIR_VEC = [{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }];
            const TANK_SIZE = 34,
                TANK_OFFSET = (CELL_SIZE - TANK_SIZE) / 2,
                BULLET_SIZE = 6;
            const GS = { IDLE: 0, RUNNING: 1, OVER: 2, WIN: 3 };
            const PLAYER_FIRE_COOLDOWN = 280;
            const ENEMY_FIRE_COOLDOWN_MIN = 400,
                ENEMY_FIRE_COOLDOWN_MAX = 1400;
            const PLAYER_SPEED = 2.2,
                ENEMY_SPEED = 1.4,
                BULLET_SPEED = 4.5;
            const ENEMY_COUNT = 5;

            // =============================================================
            // 2. DOM 引用
            // =============================================================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const overlayIcon = document.getElementById('overlayIcon');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlaySub = document.getElementById('overlaySub');
            const overlayBtn = document.getElementById('overlayBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const enemyCountDisplay = document.getElementById('enemyCountDisplay');
            const btnStart = document.getElementById('btnStart');
            const btnRestart = document.getElementById('btnRestart');
            const btnSave = document.getElementById('btnSave');
            const btnLoad = document.getElementById('btnLoad');
            const saveIndicator = document.getElementById('saveIndicator');
            const touchFire = document.getElementById('touchFire');
            const touchDirs = document.querySelectorAll('[data-dir]');

            // =============================================================
            // 3. 游戏状态
            // =============================================================
            let map = [],
                player = null,
                enemies = [],
                bullets = [],
                particles = [];
            let gameState = GS.IDLE,
                score = 0,
                highScore = 0,
                lives = 3;
            let frameId = null,
                lastTime = 0;
            const keys = { up: false, down: false, left: false, right: false, space: false };
            let playerFireTimer = 0,
                enemySpawnTimer = 0;

            // =============================================================
            // 4. 背景图加载（★★★ 新增部分 ★★★）
            // =============================================================
            const bgImage = new Image();
            let imageLoaded = false;               // 标记背景图是否加载完成
            // 图片路径：与 index.html 同目录下的 youxiditu.jpg
            bgImage.src = 'youxiditu.jpg';

            // =============================================================
            // 5. 工具函数
            // =============================================================
            function isValidCell(col, row) { return col >= 0 && col < COLS && row >= 0 && row < ROWS; }

            function getCell(col, row) { if (!isValidCell(col, row)) return T.OUTER; return map[row][col]; }

            function setCell(col, row, val) { if (isValidCell(col, row)) map[row][col] = val; }

            function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
                return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
            }

            function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

            function randFloat(min, max) { return Math.random() * (max - min) + min; }

            function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

            // =============================================================
            // 6. 地图生成
            // =============================================================
            function generateMap() {
                map = [];
                for (let r = 0; r < ROWS; r++) {
                    map.push(new Array(COLS).fill(T.EMPTY));
                }
                // 外围砖墙
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                            map[r][c] = T.OUTER;
                        }
                    }
                }
                // HXH 图案（下移3行）
                const H_PATTERN = [
                    [T.GREY, T.EMPTY, T.GREY],
                    [T.GREY, T.EMPTY, T.GREY],
                    [T.GREY, T.GREY, T.GREY],
                    [T.GREY, T.EMPTY, T.GREY],
                    [T.GREY, T.EMPTY, T.GREY]
                ];
                const X_PATTERN = [
                    [T.GREY, T.EMPTY, T.GREY],
                    [T.EMPTY, T.GREY, T.EMPTY],
                    [T.GREY, T.EMPTY, T.GREY],
                    [T.EMPTY, T.GREY, T.EMPTY],
                    [T.GREY, T.EMPTY, T.GREY]
                ];
                const offsetRow = 5;
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 3; c++) {
                        const row = offsetRow + r,
                            col = 1 + c;
                        if (isValidCell(col, row)) map[row][col] = H_PATTERN[r][c];
                    }
                }
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 3; c++) {
                        const row = offsetRow + r,
                            col = 5 + c;
                        if (isValidCell(col, row)) map[row][col] = X_PATTERN[r][c];
                    }
                }
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 3; c++) {
                        const row = offsetRow + r,
                            col = 9 + c;
                        if (isValidCell(col, row)) map[row][col] = H_PATTERN[r][c];
                    }
                }
                // 红色障碍物均匀分布
                const redCandidates = [];
                for (let r = 1; r <= 4; r++) {
                    for (let c = 1; c <= 11; c++) {
                        if (map[r][c] === T.EMPTY) redCandidates.push({ row: r, col: c, zone: 'top' });
                    }
                }
                for (let r = 10; r <= 11; r++) {
                    for (let c = 1; c <= 11; c++) {
                        if (map[r][c] === T.EMPTY) {
                            if (r === 11 && c === 6) continue;
                            redCandidates.push({ row: r, col: c, zone: 'bottom' });
                        }
                    }
                }
                for (let r = 5; r <= 9; r++) {
                    for (let c of [1, 11]) {
                        if (map[r][c] === T.EMPTY) {
                            redCandidates.push({ row: r, col: c, zone: 'side' });
                        }
                    }
                }
                const shuffled = redCandidates.sort(() => Math.random() - 0.5);
                let totalRed = randInt(14, 18);
                let topCount = randInt(6, 8);
                let bottomCount = randInt(4, 6);
                let sideCount = totalRed - topCount - bottomCount;
                if (sideCount < 2) sideCount = 2;
                if (sideCount > 6) sideCount = 6;
                totalRed = topCount + bottomCount + sideCount;
                let placed = 0;
                const topList = shuffled.filter(p => p.zone === 'top');
                const bottomList = shuffled.filter(p => p.zone === 'bottom');
                const sideList = shuffled.filter(p => p.zone === 'side');
                for (let i = 0; i < Math.min(topCount, topList.length); i++) {
                    const pos = topList[i];
                    map[pos.row][pos.col] = T.RED;
                    placed++;
                }
                for (let i = 0; i < Math.min(bottomCount, bottomList.length); i++) {
                    const pos = bottomList[i];
                    map[pos.row][pos.col] = T.RED;
                    placed++;
                }
                for (let i = 0; i < Math.min(sideCount, sideList.length); i++) {
                    const pos = sideList[i];
                    map[pos.row][pos.col] = T.RED;
                    placed++;
                }
                if (placed < totalRed) {
                    const remaining = shuffled.filter(p => map[p.row][p.col] === T.EMPTY);
                    for (let i = 0; i < Math.min(totalRed - placed, remaining.length); i++) {
                        const pos = remaining[i];
                        map[pos.row][pos.col] = T.RED;
                    }
                }
                // 玩家出生点安全
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const r = 11 + dr,
                            c = 6 + dc;
                        if (isValidCell(c, r)) {
                            if (map[r][c] === T.RED) map[r][c] = T.EMPTY;
                        }
                    }
                }
            }

            // =============================================================
            // 7. 坦克、子弹、粒子
            // =============================================================
            function createTank(col, row, dir, isPlayer) {
                const x = col * CELL_SIZE + TANK_OFFSET;
                const y = row * CELL_SIZE + TANK_OFFSET;
                return {
                    x,
                    y,
                    col,
                    row,
                    dir,
                    size: TANK_SIZE,
                    speed: isPlayer ? PLAYER_SPEED : ENEMY_SPEED,
                    isPlayer,
                    alive: true,
                    hp: 1,
                    fireCooldown: 0,
                    aiTimer: 0,
                    aiDir: dir,
                    aiShootTimer: randFloat(ENEMY_FIRE_COOLDOWN_MIN, ENEMY_FIRE_COOLDOWN_MAX),
                    aiState: 'patrol',
                    aiStateTimer: 0,
                    aiTargetX: 0,
                    aiTargetY: 0,
                };
            }

            function getTankRect(tank) { return { x: tank.x, y: tank.y, w: tank.size, h: tank.size }; }

            function getTankCenter(tank) { return { x: tank.x + tank.size / 2, y: tank.y + tank.size / 2 }; }

            function syncTankCell(tank) {
                tank.col = Math.round((tank.x + tank.size / 2) / CELL_SIZE - 0.5);
                tank.row = Math.round((tank.y + tank.size / 2) / CELL_SIZE - 0.5);
                tank.col = Math.max(1, Math.min(COLS - 2, tank.col));
                tank.row = Math.max(1, Math.min(ROWS - 2, tank.row));
            }

            function createBullet(x, y, dir, isPlayer) {
                const size = BULLET_SIZE;
                const cx = x + TANK_SIZE / 2,
                    cy = y + TANK_SIZE / 2;
                const offset = TANK_SIZE / 2 + 2;
                let bx = cx + DIR_VEC[dir].dx * offset - size / 2;
                let by = cy + DIR_VEC[dir].dy * offset - size / 2;
                return { x: bx, y: by, dir, size, speed: BULLET_SPEED, isPlayer, alive: true, get rect() { return { x: this
                            .x, y: this.y, w: this.size, h: this.size }; } };
            }

            function getBulletRect(bullet) { return { x: bullet.x, y: bullet.y, w: bullet.size, h: bullet.size }; }

            function createExplosion(x, y, color, count) {
                count = count || 20;
                for (let i = 0; i < count; i++) {
                    const angle = randFloat(0, Math.PI * 2);
                    const speed = randFloat(1, 4);
                    const size = randInt(3, 8);
                    particles.push({
                        x: x + randFloat(-4, 4),
                        y: y + randFloat(-4, 4),
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size,
                        life: randFloat(20, 50),
                        maxLife: 50,
                        color: color || '#ff6b35',
                        decay: 0.97 + randFloat(0, 0.02),
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= p.decay;
                    p.vy *= p.decay;
                    p.life--;
                    p.size *= 0.98;
                    if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = Math.min(1, p.life / p.maxLife * 1.2);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                }
                ctx.globalAlpha = 1;
            }

            // =============================================================
            // 8. 碰撞检测
            // =============================================================
            function tankCollidesWithMap(tank, nx, ny) {
                const size = tank.size;
                const corners = [
                    { x: nx, y: ny },
                    { x: nx + size - 1, y: ny },
                    { x: nx, y: ny + size - 1 },
                    { x: nx + size - 1, y: ny + size - 1 }
                ];
                for (const corner of corners) {
                    const col = Math.floor(corner.x / CELL_SIZE);
                    const row = Math.floor(corner.y / CELL_SIZE);
                    if (!isValidCell(col, row)) return true;
                    const cell = map[row][col];
                    if (cell === T.OUTER || cell === T.GREY || cell === T.RED) return true;
                }
                return false;
            }

            function tankCollidesWithTank(t1, t2) {
                if (t1 === t2 || !t1.alive || !t2.alive) return false;
                return rectCollide(t1.x, t1.y, t1.size, t1.size, t2.x, t2.y, t2.size, t2.size);
            }

            function tankCollidesWithEnemies(tank, exclude) {
                const list = exclude || enemies;
                for (const other of list) {
                    if (other === tank || !other.alive) continue;
                    if (tankCollidesWithTank(tank, other)) return true;
                }
                return false;
            }

            function bulletCollidesWithMap(bullet) {
                const cx = bullet.x + bullet.size / 2,
                    cy = bullet.y + bullet.size / 2;
                const col = Math.floor(cx / CELL_SIZE),
                    row = Math.floor(cy / CELL_SIZE);
                if (!isValidCell(col, row)) return 'hit';
                const cell = map[row][col];
                if (cell === T.OUTER || cell === T.GREY) return 'hit';
                if (cell === T.RED) return 'destroy';
                return 'pass';
            }

            function bulletCollidesWithTanks(bullet) {
                const rect = getBulletRect(bullet);
                if (bullet.isPlayer) {
                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;
                        const trect = getTankRect(enemy);
                        if (rectCollide(rect.x, rect.y, rect.w, rect.h, trect.x, trect.y, trect.w, trect.h)) return enemy;
                    }
                } else {
                    if (player && player.alive) {
                        const trect = getTankRect(player);
                        if (rectCollide(rect.x, rect.y, rect.w, rect.h, trect.x, trect.y, trect.w, trect.h)) return player;
                    }
                }
                return null;
            }

            // =============================================================
            // 9. 游戏初始化
            // =============================================================
            function resetGame() {
                if (frameId) { cancelAnimationFrame(frameId);
                    frameId = null; }
                score = 0;
                lives = 3;
                enemies = [];
                bullets = [];
                particles = [];
                playerFireTimer = 0;
                enemySpawnTimer = 0;
                gameState = GS.IDLE;
                keys.up = keys.down = keys.left = keys.right = keys.space = false;
                generateMap();
                player = createTank(6, 11, DIR.UP, true);
                player.hp = 1;
                updateUI();
                updateOverlay(true);
                saveIndicator.textContent = '未存档';
                saveIndicator.className = 'save-indicator';
                render();
            }

            function startGame() {
                if (gameState === GS.RUNNING) return;
                if (gameState === GS.OVER || gameState === GS.WIN) resetGame();
                spawnEnemies(ENEMY_COUNT);
                gameState = GS.RUNNING;
                updateOverlay(false);
                updateUI();
                if (frameId) cancelAnimationFrame(frameId);
                lastTime = performance.now();
                frameId = requestAnimationFrame(gameLoop);
            }

            function spawnEnemies(count) {
                const candidates = [];
                for (let c = 2; c <= 10; c++) candidates.push({ col: c, row: 1 });
                const shuffled = candidates.sort(() => Math.random() - 0.5);
                let spawned = 0;
                for (const pos of shuffled) {
                    if (spawned >= count) break;
                    const enemy = createTank(pos.col, pos.row, DIR.DOWN, false);
                    if (tankCollidesWithEnemies(enemy, enemies) ||
                        (player && player.alive && tankCollidesWithTank(enemy, player))) {
                        continue;
                    }
                    enemy.aiState = 'patrol';
                    enemy.aiStateTimer = randInt(60, 180);
                    enemy.aiDir = DIR.DOWN;
                    enemies.push(enemy);
                    spawned++;
                }
                if (spawned < count) {
                    for (let c = 2; c <= 10; c++) {
                        if (spawned >= count) break;
                        const enemy = createTank(c, 2, DIR.DOWN, false);
                        if (tankCollidesWithEnemies(enemy, enemies) ||
                            (player && player.alive && tankCollidesWithTank(enemy, player))) {
                            continue;
                        }
                        enemy.aiState = 'patrol';
                        enemy.aiStateTimer = randInt(60, 180);
                        enemy.aiDir = DIR.DOWN;
                        enemies.push(enemy);
                        spawned++;
                    }
                }
            }

            // =============================================================
            // 10. 游戏循环（★★★ 修改：背景绘制已加入 render ★★★）
            // =============================================================
            function gameLoop(timestamp) {
                if (gameState !== GS.RUNNING) {
                    if (gameState === GS.OVER || gameState === GS.WIN) { render();
                        updateUI(); }
                    frameId = requestAnimationFrame(gameLoop);
                    return;
                }
                const delta = Math.min(timestamp - lastTime, 32);
                lastTime = timestamp;
                update(delta);
                render();      // 渲染会先绘制背景
                updateUI();
                frameId = requestAnimationFrame(gameLoop);
            }

            function update(delta) {
                updatePlayer(delta);
                updateEnemies(delta);
                updateBullets(delta);
                updateParticles();

                const aliveEnemies = enemies.filter(e => e.alive).length;
                if (aliveEnemies < ENEMY_COUNT && enemies.length < ENEMY_COUNT + 3) {
                    enemySpawnTimer -= delta;
                    if (enemySpawnTimer <= 0) {
                        spawnEnemies(1);
                        enemySpawnTimer = 3000 + randInt(0, 2000);
                    }
                } else if (enemySpawnTimer <= 0) {
                    enemySpawnTimer = 1000;
                }

                if (enemies.filter(e => e.alive).length === 0 && gameState === GS.RUNNING) {
                    gameState = GS.WIN;
                    updateOverlay(true);
                    updateHighScore();
                }

                if (player && !player.alive && gameState === GS.RUNNING) {
                    lives--;
                    if (lives <= 0) {
                        gameState = GS.OVER;
                        updateOverlay(true);
                        updateHighScore();
                    } else {
                        respawnPlayer();
                    }
                    updateUI();
                }
                if (gameState === GS.OVER || gameState === GS.WIN) { /* stop updating */ }
            }

            // =============================================================
            // 11a. 玩家更新
            // =============================================================
            function updatePlayer(delta) {
                if (!player || !player.alive) return;
                player.fireCooldown -= delta;
                if (keys.space && player.fireCooldown <= 0) {
                    fireBullet(player);
                    player.fireCooldown = PLAYER_FIRE_COOLDOWN;
                }
                let dx = 0,
                    dy = 0;
                if (keys.up) { dy = -1;
                    player.dir = DIR.UP; }
                if (keys.down) { dy = 1;
                    player.dir = DIR.DOWN; }
                if (keys.left) { dx = -1;
                    player.dir = DIR.LEFT; }
                if (keys.right) { dx = 1;
                    player.dir = DIR.RIGHT; }
                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx * dx + dy * dy);
                    const normDx = dx / len,
                        normDy = dy / len;
                    const speed = player.speed;
                    if (dx !== 0) {
                        const nx = player.x + normDx * speed,
                            ny = player.y;
                        if (!tankCollidesWithMap(player, nx, ny) &&
                            !tankCollidesWithEnemies({ ...player, x: nx, y: ny }, enemies)) {
                            player.x = nx;
                        }
                    }
                    if (dy !== 0) {
                        const nx = player.x,
                            ny = player.y + normDy * speed;
                        if (!tankCollidesWithMap(player, nx, ny) &&
                            !tankCollidesWithEnemies({ ...player, x: nx, y: ny }, enemies)) {
                            player.y = ny;
                        }
                    }
                    player.x = Math.max(CELL_SIZE, Math.min(COLS * CELL_SIZE - CELL_SIZE - player.size, player.x));
                    player.y = Math.max(CELL_SIZE, Math.min(ROWS * CELL_SIZE - CELL_SIZE - player.size, player.y));
                    syncTankCell(player);
                }
            }

            function respawnPlayer() {
                if (!player) return;
                player.x = 6 * CELL_SIZE + TANK_OFFSET;
                player.y = 11 * CELL_SIZE + TANK_OFFSET;
                player.dir = DIR.UP;
                player.alive = true;
                player.hp = 1;
                player.fireCooldown = 0;
                syncTankCell(player);
                createExplosion(player.x + player.size / 2, player.y + player.size / 2, '#7bed9f', 30);
            }

            // =============================================================
            // 11b. 敌方AI
            // =============================================================
            function updateEnemies(delta) {
                for (const enemy of enemies) {
                    if (!enemy.alive) continue;
                    enemy.aiTimer -= delta;
                    enemy.aiShootTimer -= delta;
                    if (enemy.aiShootTimer <= 0) {
                        fireBullet(enemy);
                        enemy.aiShootTimer = randFloat(ENEMY_FIRE_COOLDOWN_MIN, ENEMY_FIRE_COOLDOWN_MAX);
                    }
                    enemy.aiStateTimer -= delta;
                    if (enemy.aiStateTimer <= 0) {
                        const states = ['patrol', 'chase', 'evade', 'shoot'];
                        let weights = [30, 40, 15, 15];
                        if (player && player.alive) {
                            const dist = Math.hypot(
                                (enemy.x + enemy.size / 2) - (player.x + player.size / 2),
                                (enemy.y + enemy.size / 2) - (player.y + player.size / 2)
                            );
                            if (dist < 200) weights = [20, 50, 20, 10];
                            else weights = [30, 30, 10, 30];
                        }
                        const total = weights.reduce((a, b) => a + b, 0);
                        let r = randFloat(0, total);
                        let idx = 0;
                        for (let i = 0; i < weights.length; i++) {
                            r -= weights[i];
                            if (r <= 0) { idx = i; break; }
                        }
                        enemy.aiState = states[idx];
                        enemy.aiStateTimer = randInt(40, 160);
                        if (enemy.aiState === 'shoot') {
                            enemy.aiShootTimer = Math.min(enemy.aiShootTimer, 200);
                        }
                    }
                    let targetDir = enemy.dir;
                    if (enemy.aiState === 'patrol') {
                        if (enemy.aiTimer <= 0) {
                            const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
                            targetDir = dirs[randInt(0, 3)];
                            enemy.aiTimer = randInt(30, 90);
                        } else {
                            targetDir = enemy.aiDir;
                        }
                    } else if (enemy.aiState === 'chase') {
                        if (player && player.alive) {
                            const cx = enemy.x + enemy.size / 2,
                                cy = enemy.y + enemy.size / 2;
                            const px = player.x + player.size / 2,
                                py = player.y + player.size / 2;
                            const dx = px - cx,
                                dy = py - cy;
                            if (Math.abs(dx) > Math.abs(dy)) {
                                targetDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
                            } else {
                                targetDir = dy > 0 ? DIR.DOWN : DIR.UP;
                            }
                            if (Math.random() < 0.2) {
                                targetDir = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT][randInt(0, 3)];
                            }
                        } else {
                            targetDir = enemy.aiDir;
                        }
                    } else if (enemy.aiState === 'evade') {
                        if (player && player.alive) {
                            const cx = enemy.x + enemy.size / 2,
                                cy = enemy.y + enemy.size / 2;
                            const px = player.x + player.size / 2,
                                py = player.y + player.size / 2;
                            const dx = cx - px,
                                dy = cy - py;
                            if (Math.abs(dx) > Math.abs(dy)) {
                                targetDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
                            } else {
                                targetDir = dy > 0 ? DIR.DOWN : DIR.UP;
                            }
                            if (Math.random() < 0.3) {
                                targetDir = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT][randInt(0, 3)];
                            }
                        } else {
                            targetDir = enemy.aiDir;
                        }
                    } else if (enemy.aiState === 'shoot') {
                        if (player && player.alive) {
                            const cx = enemy.x + enemy.size / 2,
                                cy = enemy.y + enemy.size / 2;
                            const px = player.x + player.size / 2,
                                py = player.y + player.size / 2;
                            const dx = px - cx,
                                dy = py - cy;
                            if (Math.abs(dx) > Math.abs(dy)) {
                                targetDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
                            } else {
                                targetDir = dy > 0 ? DIR.DOWN : DIR.UP;
                            }
                            if (Math.random() < 0.7) {
                                enemy.dir = targetDir;
                                continue;
                            }
                        } else {
                            targetDir = enemy.aiDir;
                        }
                    }
                    const speed = enemy.speed;
                    const vec = DIR_VEC[targetDir];
                    const nx = enemy.x + vec.dx * speed;
                    const ny = enemy.y + vec.dy * speed;
                    let canMove = true;
                    if (tankCollidesWithMap(enemy, nx, ny)) canMove = false;
                    if (canMove) {
                        const testTank = { ...enemy, x: nx, y: ny };
                        for (const other of enemies) {
                            if (other === enemy || !other.alive) continue;
                            if (tankCollidesWithTank(testTank, other)) { canMove = false; break; }
                        }
                    }
                    if (canMove && player && player.alive) {
                        const testTank = { ...enemy, x: nx, y: ny };
                        if (tankCollidesWithTank(testTank, player)) canMove = false;
                    }
                    if (canMove) {
                        enemy.x = nx;
                        enemy.y = ny;
                        enemy.dir = targetDir;
                        enemy.aiDir = targetDir;
                    } else {
                        enemy.aiTimer = 0;
                        enemy.aiStateTimer = 0;
                    }
                    enemy.x = Math.max(CELL_SIZE, Math.min(COLS * CELL_SIZE - CELL_SIZE - enemy.size, enemy.x));
                    enemy.y = Math.max(CELL_SIZE, Math.min(ROWS * CELL_SIZE - CELL_SIZE - enemy.size, enemy.y));
                    syncTankCell(enemy);
                }
            }

            // =============================================================
            // 11c. 子弹更新
            // =============================================================
            function updateBullets(delta) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    if (!bullet.alive) { bullets.splice(i, 1); continue; }
                    const vec = DIR_VEC[bullet.dir];
                    bullet.x += vec.dx * bullet.speed;
                    bullet.y += vec.dy * bullet.speed;
                    if (bullet.x < 0 || bullet.x > CANVAS_SIZE ||
                        bullet.y < 0 || bullet.y > CANVAS_SIZE) {
                        bullet.alive = false;
                        bullets.splice(i, 1);
                        continue;
                    }
                    const mapResult = bulletCollidesWithMap(bullet);
                    if (mapResult === 'hit') {
                        createExplosion(bullet.x + bullet.size / 2, bullet.y + bullet.size / 2, '#aaa', 8);
                        bullet.alive = false;
                        bullets.splice(i, 1);
                        continue;
                    } else if (mapResult === 'destroy') {
                        const cx = bullet.x + bullet.size / 2,
                            cy = bullet.y + bullet.size / 2;
                        const col = Math.floor(cx / CELL_SIZE),
                            row = Math.floor(cy / CELL_SIZE);
                        if (isValidCell(col, row) && map[row][col] === T.RED) {
                            map[row][col] = T.EMPTY;
                            createExplosion(cx, cy, '#ff4757', 18);
                            if (bullet.isPlayer) { score += 10;
                                updateUI(); }
                        }
                        bullet.alive = false;
                        bullets.splice(i, 1);
                        continue;
                    }
                    const hitTank = bulletCollidesWithTanks(bullet);
                    if (hitTank) {
                        hitTank.alive = false;
                        const center = getTankCenter(hitTank);
                        createExplosion(center.x, center.y, '#ff6b35', 30);
                        bullet.alive = false;
                        bullets.splice(i, 1);
                        if (bullet.isPlayer) { score += 50;
                            updateUI(); }
                        continue;
                    }
                }
            }

            // =============================================================
            // 11d. 射击
            // =============================================================
            function fireBullet(tank) {
                if (!tank || !tank.alive) return;
                const maxBullets = 20;
                const playerBullets = bullets.filter(b => b.isPlayer).length;
                const enemyBullets = bullets.filter(b => !b.isPlayer).length;
                if (tank.isPlayer && playerBullets >= 5) return;
                if (!tank.isPlayer && enemyBullets >= 10) return;
                const bullet = createBullet(tank.x, tank.y, tank.dir, tank.isPlayer);
                bullets.push(bullet);
                const cx = tank.x + tank.size / 2,
                    cy = tank.y + tank.size / 2;
                const dx = DIR_VEC[tank.dir].dx,
                    dy = DIR_VEC[tank.dir].dy;
                for (let i = 0; i < 4; i++) {
                    particles.push({
                        x: cx + dx * 20 + randFloat(-4, 4),
                        y: cy + dy * 20 + randFloat(-4, 4),
                        vx: dx * randFloat(1, 3) + randFloat(-0.5, 0.5),
                        vy: dy * randFloat(1, 3) + randFloat(-0.5, 0.5),
                        size: randInt(2, 5),
                        life: randInt(8, 18),
                        maxLife: 18,
                        color: tank.isPlayer ? '#ffd93d' : '#ff6b6b',
                        decay: 0.94,
                    });
                }
            }

            // =============================================================
            // 11e. 最高分
            // =============================================================
            function updateHighScore() {
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem('tankWarHighScore', String(highScore)); } catch (e) { /* ignore */ }
                }
                updateUI();
            }

            function loadHighScore() {
                try {
                    const val = localStorage.getItem('tankWarHighScore');
                    if (val !== null) highScore = parseInt(val, 10) || 0;
                } catch (e) { /* ignore */ }
                updateUI();
            }

            // =============================================================
            // 12. 存档
            // =============================================================
            function saveGame() {
                if (gameState === GS.IDLE) {
                    saveIndicator.textContent = '⏳ 没有游戏可存档';
                    saveIndicator.className = 'save-indicator';
                    return;
                }
                try {
                    const saveData = {
                        map: map,
                        player: player ? {
                            x: player.x,
                            y: player.y,
                            dir: player.dir,
                            alive: player.alive,
                            col: player.col,
                            row: player.row,
                            hp: player.hp,
                        } : null,
                        enemies: enemies.filter(e => e.alive).map(e => ({
                            x: e.x,
                            y: e.y,
                            dir: e.dir,
                            alive: e.alive,
                            col: e.col,
                            row: e.row,
                            hp: e.hp,
                            aiDir: e.aiDir,
                            aiTimer: e.aiTimer,
                            aiShootTimer: e.aiShootTimer,
                            aiState: e.aiState,
                            aiStateTimer: e.aiStateTimer,
                        })),
                        bullets: bullets.filter(b => b.alive).map(b => ({
                            x: b.x,
                            y: b.y,
                            dir: b.dir,
                            isPlayer: b.isPlayer,
                            alive: b.alive,
                        })),
                        score: score,
                        lives: lives,
                        gameState: gameState,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('tankWarSave', JSON.stringify(saveData));
                    saveIndicator.textContent = '✅ 存档成功 ' + new Date().toLocaleTimeString();
                    saveIndicator.className = 'save-indicator saved';
                } catch (e) {
                    console.error('存档失败:', e);
                    saveIndicator.textContent = '❌ 存档失败: ' + e.message;
                    saveIndicator.className = 'save-indicator';
                }
            }

            function loadGame() {
                try {
                    const raw = localStorage.getItem('tankWarSave');
                    if (!raw) {
                        saveIndicator.textContent = '❌ 没有找到存档';
                        saveIndicator.className = 'save-indicator';
                        return;
                    }
                    const data = JSON.parse(raw);
                    if (data.map && data.map.length === ROWS) map = data.map;
                    else generateMap();
                    if (data.player) {
                        player = createTank(data.player.col || 6, data.player.row || 11, data.player.dir || DIR.UP, true);
                        player.x = data.player.x;
                        player.y = data.player.y;
                        player.alive = data.player.alive;
                        player.hp = data.player.hp || 1;
                        player.dir = data.player.dir;
                        syncTankCell(player);
                    } else {
                        player = createTank(6, 11, DIR.UP, true);
                    }
                    enemies = [];
                    if (data.enemies) {
                        for (const eData of data.enemies) {
                            const enemy = createTank(eData.col || 1, eData.row || 1, eData.dir || DIR.DOWN, false);
                            enemy.x = eData.x;
                            enemy.y = eData.y;
                            enemy.alive = eData.alive;
                            enemy.hp = eData.hp || 1;
                            enemy.dir = eData.dir;
                            enemy.aiDir = eData.aiDir || DIR.DOWN;
                            enemy.aiTimer = eData.aiTimer || randInt(20, 80);
                            enemy.aiShootTimer = eData.aiShootTimer || randFloat(400, 1400);
                            enemy.aiState = eData.aiState || 'patrol';
                            enemy.aiStateTimer = eData.aiStateTimer || randInt(60, 180);
                            syncTankCell(enemy);
                            enemies.push(enemy);
                        }
                    }
                    bullets = [];
                    if (data.bullets) {
                        for (const bData of data.bullets) {
                            const bullet = createBullet(
                                bData.x - TANK_SIZE / 2,
                                bData.y - TANK_SIZE / 2,
                                bData.dir,
                                bData.isPlayer
                            );
                            bullet.x = bData.x;
                            bullet.y = bData.y;
                            bullet.alive = bData.alive;
                            bullets.push(bullet);
                        }
                    }
                    score = data.score || 0;
                    lives = data.lives || 3;
                    gameState = data.gameState || GS.IDLE;
                    if (gameState === GS.WIN || gameState === GS.OVER) updateOverlay(true);
                    else updateOverlay(false);
                    updateUI();
                    saveIndicator.textContent = '📂 读档成功 ' + new Date().toLocaleTimeString();
                    saveIndicator.className = 'save-indicator saved';
                    if (gameState === GS.RUNNING && !frameId) {
                        lastTime = performance.now();
                        frameId = requestAnimationFrame(gameLoop);
                    }
                    render();
                } catch (e) {
                    console.error('读档失败:', e);
                    saveIndicator.textContent = '❌ 读档失败: ' + e.message;
                    saveIndicator.className = 'save-indicator';
                }
            }

            // =============================================================
            // 13. 渲染（★★★ 关键修改：最先绘制背景 ★★★）
            // =============================================================
            function render() {
                // ---- 1. 绘制背景（如果已加载） ----
                if (imageLoaded && bgImage.complete && bgImage.naturalWidth > 0) {
                    ctx.drawImage(bgImage, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                } else {
                    // 未加载时填充默认深色背景（保证画面不空）
                    ctx.fillStyle = '#1e1e3a';
                    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                }

                // ---- 2. 绘制游戏元素（地图、子弹、坦克、粒子） ----
                drawMap();
                drawBullets();
                drawTanks();
                drawParticles();
            }

            // =============================================================
            // 13a. 绘制地图
            // =============================================================
            function drawMap() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = map[r][c];
                        const x = c * CELL_SIZE,
                            y = r * CELL_SIZE;
                        // 空地不再绘制，让背景透出
                        if (cell === T.EMPTY) continue;

                        if (cell === T.OUTER || cell === T.GREY) {
                            ctx.fillStyle = '#5a5a7a';
                            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                            ctx.strokeStyle = '#3d3d5c';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                            ctx.fillStyle = '#3d3d5c';
                            if ((r + c) % 2 === 0) {
                                ctx.fillRect(x + 10, y, 2, CELL_SIZE);
                                ctx.fillRect(x, y + 10, CELL_SIZE, 2);
                            } else {
                                ctx.fillRect(x + 20, y, 2, CELL_SIZE);
                                ctx.fillRect(x, y + 20, CELL_SIZE, 2);
                            }
                            if (cell === T.OUTER) {
                                ctx.strokeStyle = '#6a6a8a';
                                ctx.lineWidth = 1.5;
                                ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                            }
                        } else if (cell === T.RED) {
                            const grad = ctx.createRadialGradient(x + 8, y + 8, 2, x + 20, y + 20, 22);
                            grad.addColorStop(0, '#ff6b6b');
                            grad.addColorStop(0.6, '#ee3b3b');
                            grad.addColorStop(1, '#992222');
                            ctx.fillStyle = grad;
                            ctx.shadowColor = 'rgba(255, 50, 50, 0.3)';
                            ctx.shadowBlur = 8;
                            ctx.fillRect(x + 3, y + 3, CELL_SIZE - 6, CELL_SIZE - 6);
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = 'rgba(255,255,255,0.15)';
                            ctx.fillRect(x + 6, y + 4, 8, 4);
                            ctx.fillRect(x + 4, y + 8, 4, 6);
                            ctx.strokeStyle = '#cc3333';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                        }
                    }
                }
            }

            // =============================================================
            // 13b. 绘制坦克
            // =============================================================
            function drawTanks() {
                for (const enemy of enemies) {
                    if (enemy.alive) drawSingleTank(enemy);
                }
                if (player && player.alive) drawSingleTank(player);
            }

            function drawSingleTank(tank) {
                const x = tank.x,
                    y = tank.y,
                    size = tank.size,
                    dir = tank.dir;
                const isPlayer = tank.isPlayer;
                let bodyColor, trackColor, turretColor;
                if (isPlayer) {
                    bodyColor = '#4a9eff';
                    trackColor = '#2a6bb0';
                    turretColor = '#6ab4ff';
                } else {
                    bodyColor = '#e84118';
                    trackColor = '#a8321a';
                    turretColor = '#ff6b4a';
                }
                ctx.save();
                ctx.translate(x + size / 2, y + size / 2);
                const angle = dir * Math.PI / 2;
                ctx.rotate(angle);
                const half = size / 2;
                const bodyW = size * 0.85,
                    bodyH = size * 0.70;
                const trackW = size * 0.20,
                    trackH = size * 0.85;

                ctx.fillStyle = trackColor;
                ctx.fillRect(-half, -trackH / 2, trackW, trackH);
                ctx.fillRect(half - trackW, -trackH / 2, trackW, trackH);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                for (let i = -5; i <= 5; i++) {
                    const yy = i * (trackH / 12);
                    ctx.beginPath();
                    ctx.moveTo(-half + 2, yy);
                    ctx.lineTo(-half + trackW - 2, yy);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(half - trackW + 2, yy);
                    ctx.lineTo(half - 2, yy);
                    ctx.stroke();
                }

                const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, half);
                grad.addColorStop(0, isPlayer ? '#6ab4ff' : '#ff6b4a');
                grad.addColorStop(0.7, bodyColor);
                grad.addColorStop(1, isPlayer ? '#2a6bb0' : '#a8321a');
                ctx.fillStyle = grad;
                ctx.shadowColor = isPlayer ? 'rgba(74, 158, 255, 0.2)' : 'rgba(232, 65, 24, 0.2)';
                ctx.shadowBlur = 12;
                const bw = bodyW,
                    bh = bodyH,
                    rx = 6;
                ctx.beginPath();
                ctx.moveTo(-bw / 2 + rx, -bh / 2);
                ctx.lineTo(bw / 2 - rx, -bh / 2);
                ctx.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, -bh / 2 + rx);
                ctx.lineTo(bw / 2, bh / 2 - rx);
                ctx.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - rx, bh / 2);
                ctx.lineTo(-bw / 2 + rx, bh / 2);
                ctx.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - rx);
                ctx.lineTo(-bw / 2, -bh / 2 + rx);
                ctx.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + rx, -bh / 2);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = isPlayer ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(-bw / 2 + 6, -bh / 2 + 4, bw - 12, bh - 8);

                const turretR = size * 0.28;
                ctx.fillStyle = turretColor;
                ctx.shadowColor = isPlayer ? 'rgba(74, 158, 255, 0.25)' : 'rgba(232, 65, 24, 0.25)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, turretR, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(-4, -4, turretR * 0.35, 0, Math.PI * 2);
                ctx.fill();

                const barrelLen = size * 0.52,
                    barrelW = size * 0.10;
                ctx.fillStyle = isPlayer ? '#3a7acc' : '#cc3a1a';
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.fillRect(-barrelW / 2, -barrelLen, barrelW, barrelLen);
                ctx.shadowBlur = 0;
                ctx.fillStyle = isPlayer ? '#5a9aee' : '#ee5a3a';
                ctx.fillRect(-barrelW / 2 - 1, -barrelLen - 2, barrelW + 2, 4);

                if (isPlayer) {
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('P', 0, 2);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('E', 0, 2);
                }
                ctx.restore();

                if (!isPlayer && tank.alive) {
                    ctx.fillStyle = 'rgba(255,50,50,0.7)';
                    ctx.fillRect(x, y - 6, size, 3);
                    ctx.fillStyle = 'rgba(50,255,50,0.7)';
                    ctx.fillRect(x, y - 6, size * 0.6, 3);
                }
            }

            // =============================================================
            // 13c. 绘制子弹
            // =============================================================
            function drawBullets() {
                for (const bullet of bullets) {
                    if (!bullet.alive) continue;
                    const x = bullet.x,
                        y = bullet.y,
                        s = bullet.size;
                    const grad = ctx.createRadialGradient(x + s / 2, y + s / 2, 1, x + s / 2, y + s / 2, s + 4);
                    if (bullet.isPlayer) {
                        grad.addColorStop(0, '#ffd93d');
                        grad.addColorStop(0.5, '#f6b93b');
                        grad.addColorStop(1, 'rgba(246, 185, 59, 0)');
                    } else {
                        grad.addColorStop(0, '#ff4757');
                        grad.addColorStop(0.5, '#ee2a3a');
                        grad.addColorStop(1, 'rgba(238, 42, 58, 0)');
                    }
                    ctx.fillStyle = grad;
                    ctx.fillRect(x - 4, y - 4, s + 8, s + 8);
                    ctx.fillStyle = bullet.isPlayer ? '#fff5b0' : '#ff8a8a';
                    ctx.shadowColor = bullet.isPlayer ? '#ffd93d' : '#ff4757';
                    ctx.shadowBlur = 8;
                    ctx.fillRect(x, y, s, s);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillRect(x + 1, y + 1, s / 2, s / 2);
                }
            }

            // =============================================================
            // 14. UI更新
            // =============================================================
            function updateUI() {
                scoreDisplay.textContent = score;
                highScoreDisplay.textContent = highScore;
                livesDisplay.textContent = lives;
                const alive = enemies.filter(e => e.alive).length;
                enemyCountDisplay.textContent = alive;
                if (gameState === GS.RUNNING) {
                    btnStart.textContent = '▶ 运行中';
                    btnStart.disabled = true;
                } else {
                    btnStart.textContent = '▶ 开始';
                    btnStart.disabled = false;
                }
            }

            function updateOverlay(show) {
                if (show) {
                    overlay.classList.add('active');
                    if (gameState === GS.IDLE) {
                        overlayIcon.textContent = '🎮';
                        overlayTitle.textContent = '坦克大战';
                        overlayTitle.className = 'msg-title';
                        overlaySub.textContent = '方向键移动 · 空格射击 · 消灭所有敌人';
                        overlayBtn.textContent = '开始游戏';
                    } else if (gameState === GS.WIN) {
                        overlayIcon.textContent = '🏆';
                        overlayTitle.textContent = '🎉 胜利！';
                        overlayTitle.className = 'msg-title win';
                        overlaySub.textContent = `最终得分: ${score}  🎯 太棒了！`;
                        overlayBtn.textContent = '再来一局';
                    } else if (gameState === GS.OVER) {
                        overlayIcon.textContent = '💥';
                        overlayTitle.textContent = '😵 战败...';
                        overlayTitle.className = 'msg-title lose';
                        overlaySub.textContent = `得分: ${score}  💪 再试一次！`;
                        overlayBtn.textContent = '重新开始';
                    } else {
                        overlayBtn.textContent = '继续';
                    }
                } else {
                    overlay.classList.remove('active');
                }
            }

            // =============================================================
            // 15. 键盘 & 触控
            // =============================================================
            document.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key === 'ArrowUp' || key === 'w' || key === 'W') { keys.up = true;
                    e.preventDefault(); }
                if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = true;
                    e.preventDefault(); }
                if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = true;
                    e.preventDefault(); }
                if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = true;
                    e.preventDefault(); }
                if (key === ' ' || key === 'Space') { keys.space = true;
                    e.preventDefault(); }
                if (key === 'Enter' && (gameState === GS.IDLE || gameState === GS.OVER || gameState === GS.WIN)) {
                    e.preventDefault();
                    startGame();
                }
            });
            document.addEventListener('keyup', function(e) {
                const key = e.key;
                if (key === 'ArrowUp' || key === 'w' || key === 'W') { keys.up = false;
                    e.preventDefault(); }
                if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = false;
                    e.preventDefault(); }
                if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = false;
                    e.preventDefault(); }
                if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = false;
                    e.preventDefault(); }
                if (key === ' ' || key === 'Space') { keys.space = false;
                    e.preventDefault(); }
            });

            touchDirs.forEach(btn => {
                const dir = btn.dataset.dir;
                const keyMap = { 'up': 'up', 'down': 'down', 'left': 'left', 'right': 'right' };
                const keyName = keyMap[dir];
                if (!keyName) return;
                const startTouch = (e) => { e.preventDefault();
                    keys[keyName] = true; };
                const endTouch = (e) => { e.preventDefault();
                    keys[keyName] = false; };
                btn.addEventListener('touchstart', startTouch, { passive: false });
                btn.addEventListener('touchend', endTouch, { passive: false });
                btn.addEventListener('touchcancel', endTouch, { passive: false });
                btn.addEventListener('mousedown', startTouch);
                btn.addEventListener('mouseup', endTouch);
                btn.addEventListener('mouseleave', endTouch);
            });

            const fireStart = (e) => {
                e.preventDefault();
                keys.space = true;
                if (player && player.alive && gameState === GS.RUNNING) {
                    if (player.fireCooldown <= 0) {
                        fireBullet(player);
                        player.fireCooldown = PLAYER_FIRE_COOLDOWN;
                    }
                }
            };
            const fireEnd = (e) => { e.preventDefault();
                keys.space = false; };
            touchFire.addEventListener('touchstart', fireStart, { passive: false });
            touchFire.addEventListener('touchend', fireEnd, { passive: false });
            touchFire.addEventListener('touchcancel', fireEnd, { passive: false });
            touchFire.addEventListener('mousedown', fireStart);
            touchFire.addEventListener('mouseup', fireEnd);
            touchFire.addEventListener('mouseleave', fireEnd);

            document.querySelector('.canvas-wrapper').addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            // =============================================================
            // 16. 按钮事件
            // =============================================================
            overlayBtn.addEventListener('click', function() {
                if (gameState === GS.IDLE || gameState === GS.OVER || gameState === GS.WIN) {
                    startGame();
                } else {
                    startGame();
                }
            });
            btnStart.addEventListener('click', function() {
                if (gameState === GS.RUNNING) return;
                startGame();
            });
            btnRestart.addEventListener('click', function() {
                resetGame();
                updateOverlay(true);
                overlayBtn.textContent = '开始游戏';
                render();
            });
            btnSave.addEventListener('click', function() { saveGame(); });
            btnLoad.addEventListener('click', function() {
                loadGame();
                if (gameState === GS.RUNNING && !frameId) {
                    lastTime = performance.now();
                    frameId = requestAnimationFrame(gameLoop);
                }
                if (gameState === GS.IDLE) updateOverlay(true);
                else updateOverlay(false);
                render();
            });

            // =============================================================
            // 17. 自适应
            // =============================================================
            function resizeCanvas() {
                const wrapper = canvas.parentElement;
                const wrapperWidth = wrapper.clientWidth;
                if (wrapperWidth > 0) {
                    canvas.style.width = wrapperWidth + 'px';
                    canvas.style.height = wrapperWidth + 'px';
                }
            }
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', function() {
                setTimeout(resizeCanvas, 300);
            });

            // =============================================================
            // 18. 初始化（★★★ 图片加载完成后启动循环 ★★★）
            // =============================================================
            function init() {
                loadHighScore();
                generateMap();
                player = createTank(6, 11, DIR.UP, true);
                updateUI();
                updateOverlay(true);
                overlayBtn.textContent = '开始游戏';
                resizeCanvas();

                // ---- 加载背景图 ----
                bgImage.onload = function() {
                    imageLoaded = true;
                    console.log('背景图加载成功');
                    // 如果当前处于空闲状态，触发重绘
                    if (gameState === GS.IDLE || gameState === GS.OVER || gameState === GS.WIN) {
                        render();
                    }
                };
                bgImage.onerror = function() {
                    console.warn('背景图加载失败，使用默认背景');
                    imageLoaded = false;
                };
                // 如果图片已经缓存，立即标记加载完成
                if (bgImage.complete && bgImage.naturalWidth > 0) {
                    imageLoaded = true;
                    console.log('背景图已缓存');
                }

                // ---- 启动空闲循环（用于菜单界面动画） ----
                let idleRunning = true;

                function idleLoop() {
                    if (gameState === GS.IDLE || gameState === GS.OVER || gameState === GS.WIN) {
                        updateParticles();
                        render(); // 绘制背景
                    }
                    if (gameState === GS.IDLE) {
                        requestAnimationFrame(idleLoop);
                    } else if (gameState === GS.RUNNING) {
                        return;
                    } else {
                        requestAnimationFrame(idleLoop);
                    }
                }

                // 重写 startGame 和 resetGame 以管理 idle 状态
                const originalStartGame = startGame;
                startGame = function() {
                    if (idleRunning) idleRunning = false;
                    originalStartGame.call(this);
                };
                const originalReset = resetGame;
                resetGame = function() {
                    originalReset.call(this);
                    idleRunning = true;
                    requestAnimationFrame(idleLoop);
                };

                // 开始空闲循环
                requestAnimationFrame(idleLoop);
            }

            // =============================================================
            // 19. 启动
            // =============================================================
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

        })();
    </script>
