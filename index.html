<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贺晓慧 Eills - 个人简历</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --accent: #06b6d4;
            --accent-light: #22d3ee;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --bg-secondary: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 4px 8px rgba(0, 0, 0, 0.08), 0 12px 32px rgba(0, 0, 0, 0.10);
            --nav-bg: rgba(255, 255, 255, 0.82);
            --nav-border: rgba(226, 232, 240, 0.8);
            --glow-opacity: 0.45;
            --glow-blur: 70px;
            --glow-color-bl: #6366f1;
            --glow-color-tr: #06b6d4;
            --radius: 14px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --transition: 200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-glow: 900ms cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            --section-gap: 5rem;
            --max-width: 1100px;
            --nav-height: 60px;
            --tab-indicator: var(--primary);
            --glow-size: 55vmax;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1120;
                --bg-card: #111827;
                --bg-secondary: #1e293b;
                --text: #e2e8f0;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --border: #1e293b;
                --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
                --shadow-hover: 0 4px 8px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.35);
                --nav-bg: rgba(17, 24, 39, 0.85);
                --nav-border: rgba(30, 41, 59, 0.8);
                --glow-opacity: 0.55;
                --glow-blur: 75px;
                --primary-light: #a5b4fc;
                --accent-light: #67e8f9;
            }
        }

        [data-theme="dark"] {
            --bg: #0b1120;
            --bg-card: #111827;
            --bg-secondary: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 4px 8px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.35);
            --nav-bg: rgba(17, 24, 39, 0.88);
            --nav-border: rgba(30, 41, 59, 0.8);
            --glow-opacity: 0.55;
            --glow-blur: 75px;
            --primary-light: #a5b4fc;
            --accent-light: #67e8f9;
            --bg-secondary: #1a2332;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --bg-secondary: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 4px 8px rgba(0, 0, 0, 0.08), 0 12px 32px rgba(0, 0, 0, 0.10);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: rgba(226, 232, 240, 0.8);
            --glow-opacity: 0.45;
            --glow-blur: 70px;
            --primary-light: #818cf8;
            --accent-light: #22d3ee;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            transition: background-color 300ms ease, color 300ms ease;
            overflow-x: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .glow {
                transition: background-color 0.01ms !important;
            }
        }

        /* ===== 光晕圈 ===== */
        .glow {
            position: fixed;
            width: var(--glow-size);
            height: var(--glow-size);
            border-radius: 50%;
            filter: blur(var(--glow-blur));
            pointer-events: none;
            z-index: 0;
            opacity: var(--glow-opacity);
            transition: background-color var(--transition-glow);
            will-change: background-color;
        }
        .glow-bl {
            bottom: calc(-1 * var(--glow-size) * 0.38);
            left: calc(-1 * var(--glow-size) * 0.38);
            background-color: var(--glow-color-bl);
        }
        .glow-tr {
            top: calc(-1 * var(--glow-size) * 0.38);
            right: calc(-1 * var(--glow-size) * 0.38);
            background-color: var(--glow-color-tr);
        }
        @media (max-width: 768px) {
            .glow {
                --glow-size: 45vmax;
                filter: blur(50px);
            }
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--nav-border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            transition: background-color 300ms ease, border-color 300ms ease;
        }
        .navbar .nav-brand {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .navbar .nav-brand .brand-en {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }
        .nav-links a {
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            transition: background-color var(--transition), color var(--transition);
            white-space: nowrap;
        }
        .nav-links a:hover {
            background-color: var(--bg-secondary);
            color: var(--text);
        }
        .nav-links a.active {
            color: var(--primary);
            background-color: color-mix(in srgb, var(--primary) 10%, transparent);
            font-weight: 600;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .nav-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all var(--transition);
            padding: 0;
        }
        .nav-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            background: var(--bg-secondary);
            transform: translateY(-1px);
        }
        .nav-btn:active {
            transform: translateY(0);
        }
        @media (max-width: 768px) {
            .navbar {
                padding: 0 0.75rem;
            }
            .nav-links a {
                padding: 5px 8px;
                font-size: 0.72rem;
            }
            .navbar .nav-brand {
                font-size: 0.9rem;
            }
            .navbar .nav-brand .brand-en {
                font-size: 0.62rem;
            }
            .nav-btn {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }
        }
        @media (max-width: 480px) {
            .nav-links a {
                padding: 4px 6px;
                font-size: 0.65rem;
            }
            .navbar .nav-brand .brand-en {
                display: none;
            }
            .nav-actions {
                gap: 3px;
            }
        }

        /* ===== 主体容器 ===== */
        .main {
            position: relative;
            z-index: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: calc(var(--nav-height) + 2rem) 1.5rem 4rem;
        }
        @media (max-width: 768px) {
            .main {
                padding: calc(var(--nav-height) + 1.25rem) 1rem 3rem;
            }
        }

        section {
            scroll-margin-top: calc(var(--nav-height) + 16px);
            margin-bottom: var(--section-gap);
        }
        @media (max-width: 768px) {
            section {
                margin-bottom: 3rem;
            }
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
            margin-left: 4px;
        }
        @media (max-width: 768px) {
            .section-title {
                font-size: 1.2rem;
            }
        }

        /* ===== Hero区 ===== */
        .hero {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2rem;
            align-items: stretch;
            padding: 2rem 0 1rem;
        }
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .hero-main {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .hero-name {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            color: var(--text);
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hero-name .name-zh {
            font-size: 2.6rem;
        }
        .hero-name .name-en {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        @media (max-width: 768px) {
            .hero-name .name-zh {
                font-size: 2rem;
            }
            .hero-name .name-en {
                font-size: 0.9rem;
            }
        }

        .hero-tagline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 8%, transparent);
            padding: 6px 16px;
            border-radius: 999px;
            width: fit-content;
            letter-spacing: 0.02em;
        }
        .hero-tagline .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .hero-intro {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 620px;
            line-height: 1.75;
            letter-spacing: 0.01em;
        }
        .hero-intro strong {
            color: var(--text);
            font-weight: 600;
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 14px;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .badge:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 5%, var(--bg-card));
            transform: translateY(-1px);
        }
        .badge .badge-icon {
            margin-right: 5px;
            font-size: 0.7rem;
        }

        .hero-contact {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 210px;
            align-self: center;
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .hero-contact:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover);
        }
        .hero-contact .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition);
            word-break: break-all;
        }
        .hero-contact .contact-item:hover {
            color: var(--primary);
        }
        .hero-contact .contact-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            flex-shrink: 0;
        }
        .hero-contact .copy-btn {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: color var(--transition);
            padding: 2px 4px;
        }
        .hero-contact .copy-btn:hover {
            color: var(--primary);
        }
        @media (max-width: 900px) {
            .hero-contact {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
                min-width: auto;
                justify-content: center;
                padding: 1rem 1.25rem;
            }
            .hero-contact .contact-item {
                font-size: 0.8rem;
            }
            .hero-contact .contact-icon {
                width: 24px;
                height: 24px;
                font-size: 0.65rem;
            }
        }
        @media (max-width: 480px) {
            .hero-contact {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
        }

        /* ===== 个人照片 ===== */
        .hero-heading {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .hero-photo-wrapper {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 3px solid var(--primary-light);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            transition: box-shadow var(--transition), border-color var(--transition);
        }

        .hero-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-photo-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            border-radius: 50%;
            padding: 0.5rem;
        }

        @media (max-width: 768px) {
            .hero-photo-wrapper {
                width: 110px;
                height: 110px;
            }
            .hero-heading {
                gap: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .hero-heading {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-photo-wrapper {
                width: 100px;
                height: 100px;
            }
        }

        /* ===== 亮点成果 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }
        @media (max-width: 900px) {
            .highlights-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .highlights-grid {
                grid-template-columns: 1fr;
            }
        }
        .highlight-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem 1.25rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            animation: fadeInUp 500ms ease forwards;
            opacity: 0;
            animation-delay: calc(var(--i, 0) * 80ms);
        }
        .highlight-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
            transform: translateY(-4px);
        }
        .highlight-card .highlight-number {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary);
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
        }
        .highlight-card .highlight-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 180px;
        }
        @media (max-width: 768px) {
            .highlight-card .highlight-number {
                font-size: 1.7rem;
            }
            .highlight-card {
                padding: 1.1rem 0.9rem;
            }
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--border);
        }

        /* ===== Tabs ===== */
        .tabs-container {
            width: 100%;
        }
        .tabs-list {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0;
            margin-bottom: 1.25rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-list::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color var(--transition), border-color var(--transition), background-color var(--transition);
            white-space: nowrap;
            border-radius: 6px 6px 0 0;
            letter-spacing: 0.01em;
        }
        .tab-btn:hover {
            color: var(--text);
            background: var(--bg-secondary);
        }
        .tab-btn[aria-selected="true"] {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: -2px;
            border-radius: 6px;
        }
        .tab-panel {
            display: none;
            animation: fadeIn 300ms ease;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }
        @media (max-width: 768px) {
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
        }

        /* ===== 经历卡片 ===== */
        .exp-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .exp-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--border);
        }
        .exp-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }
        .exp-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .exp-org {
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .exp-time {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-left: auto;
            font-weight: 400;
            white-space: nowrap;
        }
        .exp-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .exp-desc ul {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .exp-desc ul li {
            position: relative;
            padding-left: 18px;
        }
        .exp-desc ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.55;
        }

        /* ===== 项目卡片 ===== */
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
        }
        .project-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);

        function handleTabKeydown(e, container, prefix) {
            const tabs = Array.from(container.querySelectorAll('.tab-btn'));
            const currentIndex = tabs.indexOf(document.activeElement);
            let newIndex = currentIndex;
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();
                if (e.key === 'ArrowRight') {
                    newIndex = (currentIndex + 1) % tabs.length;
                } else {
                    newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                }
                tabs[newIndex].focus();
                const tabId = tabs[newIndex].dataset.tab;
                if (prefix === 'exp') {
                    setActiveExpTab(tabId);
                } else {
                    setActiveProjTab(tabId);
                }
            } else if (e.key === 'Home') {
                e.preventDefault();
                tabs[0].focus();
                const tabId = tabs[0].dataset.tab;
                if (prefix === 'exp') setActiveExpTab(tabId);
                else setActiveProjTab(tabId);
            } else if (e.key === 'End') {
                e.preventDefault();
                tabs[tabs.length - 1].focus();
                const tabId = tabs[tabs.length - 1].dataset.tab;
                if (prefix === 'exp') setActiveExpTab(tabId);
                else setActiveProjTab(tabId);
            }
        }

            // 滚动到对应section时更新导航高亮和光晕
            const sections = ['hero', 'highlights', 'experience', 'projects', 'skills', 'education'];
            const scrollPos = window.scrollY + 120;
            let currentSection = 'hero';
            for (const id of sections) {
                const el = document.getElementById(id);
                if (el && el.offsetTop <= scrollPos) {
                    currentSection = id;
                }
            }
            if (currentSection !== activeSection) {
                updateGlowForSection(currentSection);
            }
        }

        // ===== 导航点击 =====
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = link.getAttribute('href').substring(1);
                const target = document.getElementById(targetId);
                if (target) {
                    const offset = parseInt(getComputedStyle(document.documentElement).getPropertyValue(
                        '--nav-height')) + 10;
                    const top = target.offsetTop - offset;
                    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                    updateGlowForSection(targetId);
                }
            });
        });

        // ===== 返回顶部 =====
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateGlowForSection('hero');
        });

        // ===== 打印 =====
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // ===== 语言按钮 =====
        langBtn.addEventListener('click', toggleLanguage);

        // ===== 主题按钮 =====
        themeBtn.addEventListener('click', toggleTheme);

        // ===== 初始化 =====
        function init() {
            // 设置初始主题
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeBtn.textContent = currentTheme === 'dark' ? '☀' : '◐';
            document.documentElement.lang = 'zh-CN';

            // 设置初始光晕
            setGlowColors('hero');

            // 渲染所有内容
            renderAll();

            // 滚动监听
            window.addEventListener('scroll', handleScroll, { passive: true });
            handleScroll();

            // 监听系统主题变化
            if (window.matchMedia) {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                mq.addEventListener('change', (e) => {
                    if (!document.documentElement.hasAttribute('data-theme')) {
                        currentTheme = e.matches ? 'dark' : 'light';
                        document.documentElement.setAttribute('data-theme', currentTheme);
                        themeBtn.textContent = currentTheme === 'dark' ? '☀' : '◐';
                    }
                });
            }

            // 键盘快捷键：按 't' 切换主题，按 'l' 切换语言
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 't' || e.key === 'T') {
                    toggleTheme();
                } else if (e.key === 'l' || e.key === 'L') {
                    toggleLanguage();
                }
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
